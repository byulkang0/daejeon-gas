<title>대전사랑카드 주유소</title>

<style>
:root{--teal:#1f8f8a;--teal-d:#16706c;--bg:#f4f6f7;--ink:#1d2327;--line:#e3e7ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{background:var(--teal);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header .ttl{flex:1;min-width:0}
header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-weight:700}
header .dt{font-size:11.5px;opacity:.9;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .dt.warn{color:#ffe9a8;opacity:1}
header button{border:0;border-radius:18px;padding:7px 10px;font-size:14px;font-weight:600;background:#fff;color:var(--teal-d)}
#status{font-size:12.5px;padding:6px 14px;background:#e9f4f3;color:var(--teal-d);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#map{height:46vh;min-height:240px;flex:none;position:relative}
.legend{position:absolute;right:8px;top:8px;z-index:500;background:rgba(255,255,255,.92);border-radius:8px;padding:5px 8px;font-size:11.5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.legend i{display:inline-block;border-radius:50%;margin:0 3px 0 6px;vertical-align:-1px}
.bar{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.lbl{flex:none;font-size:13px;font-weight:700;color:var(--teal-d);align-self:center;padding-right:2px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;color:#444}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
#list{flex:1;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.row{background:#fff;border-bottom:1px solid var(--line);padding:0 8px 0 12px;height:44px;display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.row.sel{background:#eef8f7}
.row .d{flex:none;width:50px;text-align:right;font-weight:700;color:var(--teal-d)}
.row .d.na{font-weight:500;color:#999;font-size:11.5px}
.row .n{flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#6b737a;font-size:12.5px}
.row .go{flex:none;text-decoration:none;font-size:11.5px;font-weight:600;border-radius:5px;padding:3px 6px}
.row .go.k{background:#fee500;color:#3c1e1e}
.row .go.nv{background:#03c75a;color:#fff}
.pn{display:block;font-weight:700;font-size:14px;color:var(--teal-d);text-decoration:none;padding:3px 0}
.pn.x{color:#333;font-weight:600}
.pn+.pn{border-top:1px solid #eee}
.me{width:16px;height:16px;border-radius:50%;background:#2a7de1;border:3px solid #fff;box-shadow:0 0 0 2px rgba(42,125,225,.35)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--teal);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.45}
.act{font-size:12.5px;text-decoration:none;border:1px solid var(--teal);color:var(--teal-d);border-radius:5px;padding:2px 7px;display:inline-block;margin-top:4px}
.foot{font-size:11.5px;color:#7a8288;padding:12px 14px 20px;line-height:1.5}
</style>
</head>

  const m = DATA_DATE.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  document.getElementById('dataDate').textContent = m ? `${m[1]}년 ${+m[2]}월 ${+m[3]}일 기준 데이터입니다` : (DATA_DATE ? DATA_DATE + ' 기준 데이터입니다' : '');
}
// 초기 기준 위치: 연구단지 운동장(구글 지도 표기 '사이언스대덕종합운동장', 대전 유성구)
const HOME = {lat: 36.384787, lng: 127.356453, name: '연구단지 운동장'};
let me = null, filter = 'all', selected = null;

const map = L.map('map', {zoomControl: false}).setView([HOME.lat, HOME.lng], 13);
// 바탕지도: 브이월드(국토교통부). 타일을 못 받아오면 OpenStreetMap으로 자동 전환
const VWORLD_KEY = 'F5DA2D48-C945-4E65-A83E-0E390C9E2309';
const vworld = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`, {
  minZoom: 6, maxZoom: 19, attribution: '&copy; <a href="https://www.vworld.kr" target="_blank" rel="noopener">브이월드(국토교통부)</a>'});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'});
let vwOk = 0, vwErr = 0;
vworld.on('tileload', () => vwOk++);
vworld.on('tileerror', () => { if (++vwErr >= 3 && vwOk === 0 && map.hasLayer(vworld)) { map.removeLayer(vworld); osm.addTo(map); } });
vworld.addTo(map);
const dotLayer = L.layerGroup().addTo(map);   // 미제공: 작은 검은 점 (아래)
const pinLayer = L.layerGroup().addTo(map);   // 캐시백 제공: 핀 (위)
let groups = [], meMarker = null, meCircle = null, rangeCircle = null;

const located = s => s.lat != null && s.lng != null;
function dist(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmt(km) { return km < 1 ? Math.round(km * 1000) + 'm' : km.toFixed(1) + 'km'; }
// 카카오맵 검색어: 법인 표기를 빼고 '이름 + 구'로 검색 → 장소 정보(유가 포함)로 이동
function kakaoQuery(s) {
  const gu = (s.a.match(/(동구|중구|서구|유성구|대덕구)/) || [''])[0];
  return s.n.replace(/\(주\)|㈜|\(유\)|\(유한\)|주식회사|직영/g, ' ').replace(/\s+/g, ' ').trim() + ' ' + gu;
}
const kakaoInfo = s => `https://map.kakao.com/link/search/${encodeURIComponent(kakaoQuery(s))}`;
const kakaoRoute = s => located(s) ? `https://map.kakao.com/link/to/${encodeURIComponent(s.n)},${s.lat},${s.lng}` : kakaoInfo(s);
// 네이버: 앱이 있으면 앱 길찾기, 없으면 웹 검색으로
function naverGo(id) {
  const s = STATIONS[id];
  const web = `https://map.naver.com/p/search/${encodeURIComponent(kakaoQuery(s))}`;
  if (!located(s)) { location.href = web; return false; }
  const app = `nmap://route/car?dlat=${s.lat}&dlng=${s.lng}&dname=${encodeURIComponent(s.n)}&appname=daejeon.gas`;
  let left = false;
  const onHide = () => { left = true; };
  document.addEventListener('visibilitychange', onHide, {once: true});
  location.href = app;
  setTimeout(() => { if (!left && !document.hidden) location.href = web; }, 1500);
  return false;
}
function popupHtml(g) {
  return g.list.map(s => `<a class="pn${s.c ? '' : ' x'}" href="${kakaoInfo(s)}" target="_blank" rel="noopener">${s.n} ›</a>`).join('');
}

// 같은 좌표(같은 주소)의 가맹점은 마커 하나로 묶는다
function buildGroups() {
  const byKey = {};
  STATIONS.filter(located).forEach(s => {
    const k = s.lat.toFixed(5) + ',' + s.lng.toFixed(5);
    (byKey[k] = byKey[k] || {lat: s.lat, lng: s.lng, list: []}).list.push(s);
  });
  groups = Object.values(byKey);
  groups.forEach(g => {
    g.cb = g.list.some(s => s.c);
    if (g.cb) {
      const n = g.list.filter(s => s.c).length;
      g.marker = L.marker([g.lat, g.lng], {
        icon: L.divIcon({className: '', iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24],
          html: `<div class="pin"><span>${n > 1 ? n : '⛽'}</span></div>`}),
        zIndexOffset: 500});
    } else {
      g.marker = L.circleMarker([g.lat, g.lng], {radius: 4, color: '#fff', weight: 1, fillColor: '#222', fillOpacity: .9});
    }
    g.marker.bindPopup(() => popupHtml(g));
    g.list.forEach(s => s.group = g);
  });
}

// 거리 필터(전체/3km/5km)를 지도와 목록에 함께 적용
function inRange(s) {
  if (filter === 'all' || !me) return true;
  return located(s) && dist(me, s) <= +filter;
}
function drawMap(fit) {
  pinLayer.clearLayers(); dotLayer.clearLayers();
  groups.forEach(g => { if (inRange(g)) (g.cb ? pinLayer : dotLayer).addLayer(g.marker); });
  if (rangeCircle) { map.removeLayer(rangeCircle); rangeCircle = null; }
  if (me && filter !== 'all') {
    rangeCircle = L.circle([me.lat, me.lng], {radius: +filter * 1000, color: '#1f8f8a', weight: 1.5, dashArray: '5 5', fill: false, interactive: false}).addTo(map);
    if (fit) map.fitBounds(rangeCircle.getBounds(), {padding: [10, 10]});
  } else if (fit && me) {
    const near = STATIONS.filter(s => s.c && located(s)).sort((a, b) => dist(me, a) - dist(me, b)).slice(0, 3);
    map.fitBounds(L.latLngBounds([[me.lat, me.lng], ...near.map(s => [s.lat, s.lng])]).pad(0.25));
  }
}

function render() {
  let rows = STATIONS.filter(s => s.c);              // 목록에는 캐시백 제공 주유소만
  rows.forEach(s => s.d = (me && located(s)) ? dist(me, s) : Infinity);
  rows = rows.filter(inRange);
  if (me) rows.sort((a, b) => a.d - b.d);
  const list = document.getElementById('list');
  list.innerHTML = rows.map(s => `
    <div class="row${selected === s ? ' sel' : ''}" data-id="${s.id}">
      <span class="d${located(s) ? '' : ' na'}">${located(s) ? (me ? fmt(s.d) : '') : '위치미상'}</span>
      <span class="n">${s.n}</span>
      <span class="a">${s.a.replace(/^대전\s*/, '')}</span>
      <a class="go k" href="${kakaoRoute(s)}" target="_blank" rel="noopener">카카오</a>
      <a class="go nv" href="#" onclick="return naverGo(${s.id})">네이버</a>
    </div>`).join('') || '<div class="foot">이 거리 안에는 캐시백 주유소가 없어요.</div>';
  const cbN = STATIONS.filter(s => s.c).length, mapN = STATIONS.filter(located).length, miss = STATIONS.length - mapN;
  list.insertAdjacentHTML('beforeend', `<div class="foot">목록: 캐시백 제공 ${cbN}곳 · 지도: ${mapN}곳 (${DATA_SRC})${miss ? ` · 위치 미확인 ${miss}곳은 지도에 없음` : ''}.<br><b>이용 안내</b>: 이 페이지는 개인이 만든 비공식 참고용 페이지로, 대전광역시·대전사랑카드(온통대전) 운영 측과 관계없어요. 가맹점·캐시백 정보는 늦게 반영되거나 틀릴 수 있고, 지도 위치와 거리도 실제와 다를 수 있어요. 결제 전에 온통대전 앱이나 주유소에서 직접 확인해 주시고, 이용에 따른 판단과 책임은 이용자에게 있어요.<br>지도에서 핀을 누른 뒤 주유소 이름을 누르면 카카오맵 장소 정보(유가 등)로 이동해요. 위치는 브이월드 주소 좌표 기준이라 실제 입구와 조금 다를 수 있어요. 처음에는 연구단지 운동장 기준이고, 내 위치 버튼을 누르면 내 위치, 지도를 길게 누르면 그 지점 기준으로 다시 계산해요. 운동장 기준으로 돌아가려면 페이지를 새로 여세요.</div>`);
  list.querySelectorAll('.row').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const s = STATIONS[+el.dataset.id];
    if (!located(s)) return;
    selected = s;
    list.querySelectorAll('.row.sel').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    map.setView([s.lat, s.lng], 15);
    s.group.marker.openPopup();
    document.getElementById('map').scrollIntoView({behavior: 'smooth'});
  }));
}

function setMe(lat, lng, acc, label) {
  me = {lat, lng};
  if (!meMarker) meMarker = L.marker([lat, lng], {icon: L.divIcon({className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8]}), zIndexOffset: 1000, interactive: false}).addTo(map);
  else meMarker.setLatLng([lat, lng]);
  if (meCircle) { map.removeLayer(meCircle); meCircle = null; }
  if (acc) meCircle = L.circle([lat, lng], {radius: acc, color: '#2a7de1', weight: 1, fillOpacity: .08, interactive: false}).addTo(map);
  drawMap(true); render();
  const n = STATIONS.filter(s => s.c && located(s)).sort((a, b) => dist(me, a) - dist(me, b))[0];
  document.getElementById('status').textContent = `${label} · 가장 가까운 캐시백: ${n.n} (${fmt(dist(me, n))})`;
}

function locate() {
  const st = document.getElementById('status');
  if (!navigator.geolocation) { st.textContent = '위치 확인을 지원하지 않는 브라우저예요. 지도를 길게 눌러 기준 위치를 정하세요.'; return; }
  st.textContent = '위치를 확인하는 중…';
  navigator.geolocation.getCurrentPosition(
    p => setMe(p.coords.latitude, p.coords.longitude, p.coords.accuracy, '현재 위치 기준'),
    err => { st.textContent = err.code === 1 ? '위치 권한이 꺼져 있어요. 허용하거나 지도를 길게 눌러 기준 위치를 정하세요.' : '위치를 못 가져왔어요. 내 위치 버튼을 다시 누르거나 지도를 길게 누르세요.'; },
    {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
}

map.on('contextmenu', e => setMe(e.latlng.lat, e.latlng.lng, 0, '지도에서 고른 위치 기준'));
document.getElementById('locBtn').onclick = locate;
const goHome = () => setMe(HOME.lat, HOME.lng, 0, HOME.name + ' 기준');
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f;
  if (filter !== 'all' && !me) document.getElementById('status').textContent = '거리 필터는 위치를 확인한 뒤에 적용돼요. 내 위치 버튼을 누르거나 지도를 길게 누르세요.';
  drawMap(true); render();
});

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  // 첫 줄이 '기준일,2026-11-18' 형식이면 데이터 기준일로 읽고 건너뛴다
  if (rows.length && /^#?\s*기준일/.test((rows[0][0] || '').trim())) { const d = (rows.shift()[1] || '').trim(); if (d) DATA_DATE = d; }
  const head = rows.shift().map(h => h.trim());
  const col = name => head.indexOf(name);
  const [cN, cA, cP, cC, cLa, cLn] = ['상호', '주소', '전화', '캐시백', '위도', '경도'].map(col);
  return rows.filter(r => r.length > 1 && r[cN]).map(r => ({
    n: r[cN].trim(), a: (r[cA] || '').trim(), p: (r[cP] || '').trim(),
    c: /^(제공|o|y|yes|1|true|✓)$/i.test((r[cC] || '').trim()),
    lat: isFinite(parseFloat(r[cLa])) ? parseFloat(r[cLa]) : null,
    lng: isFinite(parseFloat(r[cLn])) ? parseFloat(r[cLn]) : null
  })).map(s => (s.lat == null || s.lng == null) ? Object.assign(s, {lat: null, lng: null}) : s);
}


async function loadData() {
  try {
    const res = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'});
    if (res.ok) { const list = parseCSV(await res.text()); if (list.length) { STATIONS = list; DATA_SRC = '파일에서 불러옴'; } }
  } catch (e) { /* 파일이 없거나 막혀 있으면 내장 데이터 사용 */ }
  STATIONS.forEach((s, i) => s.id = i);
  showDate();
  buildGroups(); goHome();   // 처음엔 운동장 기준, 내 위치 버튼을 누르면 내 위치 기준
}
loadData();
</script>
</body>
</html>
